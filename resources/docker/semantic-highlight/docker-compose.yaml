name: ragstudio-highlight

services:
  highlight:
    image: ragstudio-highlight:latest
    container_name: ragstudio-highlight
    ports:
      - "8001:8001"
    environment:
      QUANTIZE: int8
      HF_HUB_OFFLINE: "1"
      # chunk 级并发数（默认 min(8, cpu核心数)，CPU 上并行处理多 chunk 可省约 30%+ 时间）
      HIGHLIGHT_WORKERS: "8"
    restart: unless-stopped
    mem_limit: 8g
    mem_reservation: 4g
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
