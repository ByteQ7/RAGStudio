ai-log:
  # 是否保存 AI 对话日志到 AILog/ 目录
  save-enabled: ${SAVE_AI_LOG:false}

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /api/ragstudio

spring:
  # 加载项目根目录的 .env（bootstrap/ 是子模块，从 bootstrap 或项目根启动时均可命中）
  # optional: 前缀保证文件缺失（如 CI）不报错；未命中时使用下方各占位符的默认值
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: ragstudio${unique-name:}-service

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragstudio}
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RAGStudioHikariPool

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: ragstudio-producer${unique-name:}_pg
    send-message-timeout: 2000

rag:
  # Agent 循环配置（docs/quick-start.md 中已声明，此处补齐实际绑定）
  agent:
    max-iterations: 10        # Agent 循环最大迭代次数
    timeout-ms: 120000        # Agent 总执行超时（毫秒），超时强制中断 Agent
  skills:
    dir: skills              # SKILL 目录（相对于项目根目录）
    allowed-commands: ""     # 允许执行的命令前缀白名单，空表示禁用 command 类型
    script-timeout-ms: 30000 # 脚本执行超时（毫秒）
    sandbox:
      enabled: ${SANDBOX_ENABLED:true}   # 是否启用 Docker 沙箱（false 则禁止所有 script/command 执行）
      image: ${SANDBOX_IMAGE:sandbox:latest}  # 沙箱镜像
      memory: 256m           # 内存限制
      cpus: "0.5"            # CPU 限制
      timeout-ms: 30000      # 执行超时
  embedding-cache:
    # embedding 结果缓存：true 时启用 Redis 二级缓存（跨服务重启/多实例共享），false 仅本地内存
    # Redis 不可用时自动降级为纯本地缓存，不影响检索
    redis-enabled: ${EMBEDDING_CACHE_REDIS:false}
    # 缓存 TTL（小时）：模型服务端升级/输出漂移时，过长的 TTL 会冻结陈旧向量，导致
    # 选库排序与检索相关性失真（曾因 24h TTL 配合模型更新引发选库系统性错选）。建议 ≤ 6h
    ttl-hours: ${EMBEDDING_CACHE_TTL_HOURS:6}

  vector:
    type: pg

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true
    # 简单问题跳过 LLM 改写：无历史 + 短问题 + 无指代/追问意图时用规则归一化+规则拆分，省一次 LLM 往返
    skip-simple: true

  rate-limit:
    global:
      enabled: true
      max-concurrent: ${MAX_CONCURRENT:3}
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 6
    compress-threshold: 12   # 超过 6 轮到 12 轮时触发压缩，压缩后保留 6 轮原文
    summary-enabled: true
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  # Graph RAG（实体关系图谱）：docs/graph-rag-design.md
  # - 默认关闭：开启后文档入库/变更时增量抽取实体关系（chunk 哈希缓存，未变更零 LLM 成本）
  # - 检索侧：图谱通道接入 RrfHybridChannel，与向量/关键词 RRF 融合
  graph:
    enabled: ${RAG_GRAPH_ENABLED:false}
    extract:
      model-key: graph_extract   # t_default_model_config 场景键，缺省回退 chat 默认模型
      max-entities-per-chunk: 30
      max-relations-per-chunk: 50
      temperature: 0.1
      timeout-ms: 30000
      parallel-limit: 4
      max-chunk-chars: 6000
      max-evidence-chars: 200
      max-chunks-per-build: 500
    retrieval:
      enabled: true
      max-depth: 2
      max-neighbors-per-hop: 30
      max-nodes: 200
      max-context-triples: 40
      query-entity-limit: 5
      entity-match-threshold: 0.3
      query-extract-timeout-ms: 10000
    entity:
      embedding-enabled: false   # 实体向量兜底通道（Phase 2）
      merge-cosine-threshold: 0.92
      max-entities-per-kb: 50000
      max-relations-per-kb: 200000
    community:
      enabled: false             # 全局检索（Phase 2）
      max-communities: 3

  search:
    default-top-k: ${DEFAULT_TOP_K:10}

    # 重排后动态 TopK（分数簇感知）
    # - 存在显著落差（相邻分数差 ≥ max(0.15, 15%×最高分)）→ 截断在落差处，避免硬塞满 base-max 浪费 token
    # - 分数接近（无显著落差）→ 按接近度扩量，最多 overflow-cap 个，避免截断丢弃同等相关的正确 chunk
    max-final-chunks: 5          # 基准目标值
    rerank-min-score: 0.3        # 绝对底线，低于此分数直接丢弃
    dynamic-top-k-enabled: true
    dynamic-top-k-score-gap: 0.15       # 绝对落差阈值
    dynamic-top-k-tie-band-ratio: 0.15  # 相对接近度比例（相对最高分）
    dynamic-top-k-overflow-cap: 10      # 分数接近时的扩量上限
    dynamic-top-k-min-chunks: 3         # 缩量保底：判出明显落差也至少保留 3 条（避免答案群被截在带外）
    dynamic-top-k-cliff-ratio: 1.5      # 悬崖比值阈值：相邻分数比值 ≥1.5 且差值达阈值才算悬崖（对分数尺度鲁棒）

    # 粗召层 per-KB 融合（同一套分数簇感知截断，在 rerank 之前）
    # - 每个知识库先融合到 overflow-cap（15 条），再由分数分布决定实际进入 rerank 的数量
    # - 分数接近 → 保留更多（避免正确 chunk 在粗召阶段被硬截丢失）
    # - 有明显落差 → 保留更少（弱相关库不硬凑 per-kb-chunk-limit 条）
    per-kb-chunk-limit: 5        # per-KB 基准目标值
    per-kb-overflow-cap: 15      # per-KB 扩量上限（粗召候选池上限）

    # 知识库语义选择（嵌入相似度选库）
    # - top-k 默认覆盖全部用户选定知识库：选库排序受嵌入模型稳定性影响，硬截断会把正确知识库
    #   整体排除导致检索零召回；相关度裁剪交由检索阶段的 rerank + 动态 TopK 完成
    # - tie-band-ratio：与第 topK 名分数接近（差距 ≤10%）的候选库一并保留，防模型分数抖动误截
    # - 全部低于阈值时判定为无关、不检索（已移除"降级保留最佳库"兜底，避免天气/闲聊等
    #   明显无关问题被强制触发知识库检索）
    kb-selection-top-k: 8
    kb-selection-tie-band-ratio: 0.10
    kb-selection-threshold: 0.32

    # 语义裁剪（ContextCropper）性能优化（进程内 bge-small-zh-v1.5 模型，单句约 10ms）
    # - enabled：是否启用语义裁剪（.env 中 RAG_CROP_ENABLED，默认关闭；
    #   开启后模型目录缺失或加载失败则应用启动报错）
    # - model-path：bge-small-zh-v1.5 量化 ONNX 模型目录（含 config.json/vocab.txt/onnx/model_quantized.onnx）
    # - threshold：余弦相似度阈值，>= 阈值的句子被保留（初始 0.35，按业务微调）
    # - min-chars：参与裁剪文本总字符数低于该值 → 跳过裁剪保原文
    # - max-sentences-per-chunk：每条 chunk 最多裁剪句数（0=不限制）
    # - cache-enabled：裁剪结果 Redis 缓存（(问题, chunk) 幂等，追问/重复提问直接命中）
    crop:
      enabled: ${RAG_CROP_ENABLED:false}
      model-path: ${RAG_CROP_MODEL_PATH:./resources/models/bge-small-zh-v1.5}
      threshold: ${RAG_CROP_THRESHOLD:0.35}
      min-chars: 800
      max-sentences-per-chunk: 20
      cache-enabled: true
      cache-ttl-hours: 6
      timeout-ms: 0

    # 远程 Rerank 全局候选数量上限：多知识库粗召候选先截断再送 Rerank，避免输入量线性膨胀
    max-rerank-candidates: 40

    channels:
      # 向量全局检索（当前已禁用：VectorGlobalSearchChannel.isEnabled() 返回 false）
      vector-global:
        enabled: false
        top-k-multiplier: 3

      # 知识库选择检索（用户选定知识库后生效）
      knowledge-base-selection:
        top-k-multiplier: 2

      # 关键词检索（基于 pg_trgm gin_trgm_ops 索引）
      keyword:
        enabled: true
        top-k-multiplier: 2

      # 混合检索：向量 + 关键词 → RRF 融合
      hybrid-rrf:
        enabled: true
        k: 60                # RRF 平滑常数
        top-k: 5             # 融合后最终返回的结果数

  trace:
    enabled: ${TRACE_ENABLED:true}
    max-error-length: 1000

  model-routing:
    selection:
      failure-threshold: 2
      open-duration-ms: 30000
    stream:
      # SSE 消息分块大小（字符）：过小会导致事件数/flush 次数线性膨胀，
      # 1 字符/事件在长回答下产生数千个 SSE 事件与 servlet flush，徒增 CPU 与网络开销
      message-chunk-size: ${SSE_MESSAGE_CHUNK_SIZE:16}
    http:
      connect-timeout-seconds: 10
      # 同步调用读超时 60s：配合 chat 的 fallback 次数上限，避免模型挂起/降级时
      # 单次请求串联多次 2 分钟超时（此前最长请求达 10 分钟）
      read-timeout-seconds: 60
    sync-chat:
      # 同步 Chat（ReACT 迭代/改写/标题等）失败后最多继续尝试的候选数：
      # 主模型失败后再试 1 个候选即终止，防止全量候选串联重试造成分钟级长尾
      max-fallback: 1

mineru:
  # MinerU 文档解析服务全局开关：false 表示未部署 MinerU，一律走 Tika/多模态兜底
  enabled: ${MINERU_ENABLED:false}
  local:
    base-url: ${MINERU_LOCAL_BASE_URL:}
    backend: ${MINERU_LOCAL_BACKEND:pipeline}
    lang: ${MINERU_LOCAL_LANG:ch}
  remote:
    # mineru.net 官方 Agent 轻量 API：免费免 Token（≤10MB、≤20 页、IP 限频）
    base-url: ${MINERU_REMOTE_BASE_URL:https://mineru.net/api/v1/agent}
    api-key: ${MINERU_REMOTE_API_KEY:}
    backend: ${MINERU_REMOTE_BACKEND:pipeline}
    lang: ${MINERU_REMOTE_LANG:ch}
  # 单次解析超时（秒）：首次加载模型可能需 60–120s，故放宽到 300s
  timeout-seconds: ${MINERU_TIMEOUT_SECONDS:300}
  # 文本结果最小有效长度阈值，低于该值判定 MinerU 解析不达标并回退多模态 LLM
  min-text-length: ${MINERU_MIN_TEXT_LENGTH:50}

rustfs:
  url: ${RUSTFS_URL:http://localhost:9000}
  access-key-id: ${RUSTFS_ACCESS_KEY:}
  secret-access-key: ${RUSTFS_SECRET_KEY:}

sa-token:
  token-name: Authorization
  timeout: ${TOKEN_TIMEOUT:2592000}
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

logging:
  level:
    # MCP SDK 在连接某些 SSE 端点时会打印非关键警告，降级以避免干扰
    io.modelcontextprotocol: ERROR
    # PDFBox 解析中文字体 CFF 字形时的无害警告
    org.apache.fontbox: ERROR

app:
  demo-mode: ${DEMO_MODE:false}
  default-avatar-url: "${DEFAULT_AVATAR_URL:https://avatars.githubusercontent.com/u/583231?v=4}"
